# 将 prefix 改为 Ctrl + a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 开启鼠标支持（点击切换窗格/窗口、拖动调整大小、滚轮滚动）
set -g mouse on

# Vim 风格切换窗格
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ======= 状态栏：Powerline 箭头风格 =======
# --- 配色（任选一套，注释其余） ---
# Midnight Blue
set -g @bar_bg "#0B1523"; set -g @bar_cur "#3978AC"
# 左侧渐变色（深 → 浅）
set -g @g1 "#1D3A5F"; set -g @g2 "#3978AC"; set -g @g3 "#6FA8DC"
# Deep Navy
# set -g @bar_bg "#080F1B"; set -g @bar_cur "#284D75"
# Tokyo Night
# set -g @bar_bg "#1A1B26"; set -g @bar_cur "#3D59A1"
# Arctic Blue
# set -g @bar_bg "#101820"; set -g @bar_cur "#507DA0"

set -g status on
set -g status-position bottom       # 状态栏位置：bottom / top
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#0B1523,fg=#8FA3BF"
# 鼠标选中（复制模式）高亮颜色与主题一致
set -g mode-style "bg=#3978AC,fg=#0B1523,bold"
set -g status-left-length 40
set -g status-right-length 80

# 左侧：会话名 → 窗口序号，三段蓝色渐变 + 右箭头
set -g status-left "#[fg=#0B1523,bg=#6FA8DC,bold] #S #[fg=#6FA8DC,bg=#0B1523,nobold] "

# 窗口列表：index > name，当前窗口高亮 + 箭头
set -g window-status-separator ""
set -g window-status-format "#[fg=#0B1523,bg=#22344F,nobold] #[fg=#8FA3BF]#I #W #[fg=#22344F,bg=#0B1523]"
set -g window-status-current-format "#[fg=#0B1523,bg=#3978AC,nobold] #[fg=#0B1523,bold]#I #W #[fg=#3978AC,bg=#0B1523,nobold]"

set -g status-right "#[fg=#33547f,bg=#0B1523]#[fg=#DCE6F5,bg=#33547f] %Y-%m-%d #[fg=#3978AC,bg=#33547f]#[fg=#0B1523,bg=#3978AC,bold] %H:%M #[fg=#6FA8DC,bg=#3978AC]#[fg=#0B1523,bg=#6FA8DC,bold] #(whoami) "
